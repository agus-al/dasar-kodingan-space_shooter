<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter - JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="score-board">
                <span>Skor: <span id="score">0</span></span>
            </div>
            <div class="health-board">
                <span>Health: <span id="health">3</span> ❤️</span>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div class="game-overlay" id="gameOverlay">
            <div class="game-message" id="gameMessage">GAME OVER</div>
            <button class="restart-btn" id="restartBtn" onclick="resetGame()">Main Lagi</button>
        </div>
        
        <div class="controls-info">
            <p>← → : Gerak | Spasi : Tembak</p>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
